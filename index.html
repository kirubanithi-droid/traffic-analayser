<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Domain Analyzer Hub</title>
    <style>
        :root {
            --primary: #8a2be2;
            --secondary: #00fa9a;
            --bg-dark: #1e1e2f;
            --bg-panel: #2a2a40;
            --text: #f0f0f0;
            --text-muted: #b0b0c0;
            --accent: #ff4500;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text);
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 3em;
            margin: 0;
        }

        .main-container {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }

        .input-panel {
            background-color: var(--bg-panel);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            width: 300px;
            flex-shrink: 0;
        }

        textarea {
            width: 100%;
            height: 250px;
            background-color: #3b3b55;
            border: 2px solid var(--primary);
            border-radius: 8px;
            color: var(--text);
            padding: 15px;
            font-size: 16px;
            resize: none;
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            padding: 15px;
            background-color: var(--secondary);
            color: #1e1e2f;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s ease;
        }

        button:hover {
            background-color: #00d080;
        }

        .results-panel {
            flex-grow: 1;
            background-color: var(--bg-panel);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            text-align: left;
            padding: 15px;
            border-bottom: 1px solid #3b3b55;
        }

        th {
            color: var(--text-muted);
            font-weight: 600;
        }

        .grab-panel {
            width: 300px;
            flex-shrink: 0;
            background-color: var(--bg-panel);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .grab-panel h3 {
            color: var(--accent);
            text-align: center;
        }

        #grabList {
            width: 100%;
            height: 200px;
            background-color: #3b3b55;
            border: 1px solid #3b3b55;
            border-radius: 8px;
            color: var(--text);
            padding: 10px;
            font-family: monospace;
            font-size: 14px;
            box-sizing: border-box;
            overflow-y: scroll;
        }

    </style>
</head>
<body>

<div class="header">
    <h1>PRO DOMAIN ANALYZER HUB</h1>
    <p>பல டொமைன்களை ஒரே நேரத்தில் பகுப்பாய்வு செய்யுங்கள் (Analyze multiple domains at once).</p>
</div>

<div class="main-container">
    <div class="input-panel">
        <textarea id="domainInput" placeholder="Eg: google.com
example.in
yahoo.com
(Enter one domain per line)"></textarea>
        <button onclick="analyzeDomains()">Bulk Analyze</button>
    </div>

    <div class="results-panel">
        <table>
            <thead>
                <tr>
                    <th>Domain</th>
                    <th>Est. Monthly Visits</th>
                    <th>Top Source</th>
                    <th>Backlinks</th>
                    <th>Domain Rating (DR)</th>
                </tr>
            </thead>
            <tbody id="resultsBody">
                <!-- Result rows will be inserted here -->
            </tbody>
        </table>
    </div>

    <div class="grab-panel">
        <h3>உயர்தர டொமைன்கள் (High Quality - DR > 60)</h3>
        <p style="font-size:12px; color:var(--text-muted); text-align:center;">
            இங்கிருந்து நகலெடுத்து ஒட்டவும் (Copy and Paste from here).
        </p>
        <textarea id="grabList" readonly></textarea>
    </div>
</div>

<script>
    function analyzeDomains() {
        const input = document.getElementById('domainInput').value;
        const domains = input.split('\n').map(d => d.trim()).filter(d => d !== "");
        const resultsBody = document.getElementById('resultsBody');
        const grabList = document.getElementById('grabList');

        if (domains.length === 0) {
            alert("Analyze செய்ய டொமைன் பெயர்களை உள்ளிடவும்.");
            return;
        }

        // Clear previous results
        resultsBody.innerHTML = '';
        grabList.value = '';
        let highDrDomains = [];

        // Core Logic Note: Real bulk data requires a backend API.
        // This is a simulation for UI display.
        domains.forEach((domain, index) => {
            let seed = domain.length + index;
            let visits = (seed * 105420).toLocaleString();
            let sources = ["Organic Search", "Direct Traffic", "Social Media", "Referrals"];
            let backlinks = (seed * 543).toLocaleString();
            // Simulate DR: High for short domains, variable for others.
            let dr = domain.length < 5 ? 80 : (30 + (seed % 45));

            // Populate table
            let row = resultsBody.insertRow();
            row.insertCell(0).innerText = domain;
            row.insertCell(1).innerText = visits;
            row.insertCell(2).innerText = sources[seed % sources.length];
            row.insertCell(3).innerText = backlinks;
            let drCell = row.insertCell(4);
            drCell.innerText = dr;
            
            // Highlight High DR
            if (dr > 60) {
                drCell.style.color = 'var(--secondary)';
                drCell.style.fontWeight = 'bold';
                highDrDomains.push(domain);
            }
        });

        // Update Grab List
        if (highDrDomains.length > 0) {
            grabList.value = highDrDomains.join('\n');
        } else {
            grabList.value = "DR > 60 டொமைன்கள் எதுவும் இல்லை.";
        }
    }
</script>

</body>
</html>
